# 진단용: 깃허브 서버에서 공공데이터포털 API 호출 시험 (수동 실행 전용, 확인 후 삭제)
name: 접속 진단
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: curl 시험 (1000건)
        env:
          KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: |
          curl -sS -m 60 -G "https://apis.data.go.kr/B551938/VslPstnInfoService/getVslPstnInfo" --data-urlencode "serviceKey=$KEY" -d numOfRows=1000 -d pageNo=1 -d resultType=json -D headers.txt -o body.txt -w "HTTP %{http_code} / %{size_download} bytes / %{time_total}s\n" || echo "curl 실패"
          echo "-- 응답 헤더"; cat headers.txt || true
          echo "-- 본문 앞부분"; head -c 200 body.txt || true; echo
      - name: Node fetch 시험 (1 / 100 / 1000건, 화물 API)
        env:
          KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: |
          cat > t.mjs <<'JS'
          const KEY = process.env.KEY;
          const tests = [
            ['선박위치', 'https://apis.data.go.kr/B551938/VslPstnInfoService/getVslPstnInfo', 1, {}],
            ['선박위치', 'https://apis.data.go.kr/B551938/VslPstnInfoService/getVslPstnInfo', 100, {}],
            ['선박위치', 'https://apis.data.go.kr/B551938/VslPstnInfoService/getVslPstnInfo', 1000, {}],
            ['화물', 'https://apis.data.go.kr/B551938/IntgCagInfoService/getIntgCagInfo', 1, { prtCd: '820', ptentYr: '2026', bzentyCd: '', callsgn: '', vyg: '' }],
          ];
          for (const [name, url, n, p] of tests) {
            const q = new URLSearchParams({ serviceKey: KEY, numOfRows: String(n), pageNo: '1', resultType: 'json', ...p });
            const t = Date.now();
            try {
              const r = await fetch(`${url}?${q}`, { signal: AbortSignal.timeout(30000) });
              const tx = await r.text();
              console.log(`${name} ${n}건: HTTP ${r.status} / ${tx.length}자 / ${Date.now() - t}ms / ${tx.slice(0, 120)}`);
            } catch (e) {
              const c = e.cause || {};
              console.log(`${name} ${n}건: 실패 ${e.name}: ${e.message} / 원인 ${c.code || ''} ${c.message || ''} / ${Date.now() - t}ms`);
            }
          }
          JS
          node --version
          node t.mjs
