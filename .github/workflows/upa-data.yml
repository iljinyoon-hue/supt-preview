# 울산항 공공데이터 자동 갱신: data/port-now.json(매시) · data/bulk-trend.json(하루 한 번)
# 필요한 설정: 저장소 Settings > Secrets and variables > Actions > Secrets 에 DATA_GO_KR_KEY(공공데이터포털 일반 인증키)
# 사용 API: 울산항만공사_항내 선박위치정보(15156631), 울산항만공사_울산항 수출입 화물정보(15156637)
name: 울산항 공공데이터 갱신
on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: upa-data
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 공공데이터 받아 JSON 갱신
        run: node scripts/fetch-upa.mjs
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
      - name: 바뀐 파일만 커밋
        id: commit
        run: |
          git config user.name "upa-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/port-now.json data/bulk-trend.json
          if git diff --cached --quiet; then echo "변경 없음"; echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          git commit -m "울산항 공공데이터 갱신 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      # Actions가 올린 커밋은 깃허브 페이지를 자동으로 다시 게시하지 않으므로 직접 요청
      - name: 깃허브 페이지 다시 게시
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${{ github.repository }}/pages/builds" || echo "::warning::페이지 재게시 요청 실패 - Settings > Pages 설정 확인"
